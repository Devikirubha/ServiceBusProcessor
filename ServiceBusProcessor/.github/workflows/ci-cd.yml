name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/servicebus-processor

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build & Test
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ServiceBusProcessor.sln

      - name: Build (Release)
        run: dotnet build ServiceBusProcessor.sln -c Release --no-restore

      - name: Run unit & integration tests
        run: |
          dotnet test tests/Tests/Tests.csproj \
            -c Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Docker build & push (main/develop only)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to TST
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-tst:
    name: Deploy to TST
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: TST

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Deploy to TST
        env:
          ASPNETCORE_ENVIRONMENT: TST
          TST_DB_PASSWORD: ${{ secrets.TST_DB_PASSWORD }}
          TST_SERVICEBUS_CONNECTION: ${{ secrets.TST_SERVICEBUS_CONNECTION }}
          TST_JWT_SECRET: ${{ secrets.TST_JWT_SECRET }}
        run: |
          echo "Deploying to TST environment..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop"
          # Add your actual deploy commands here (kubectl apply, az webapp deploy, etc.)

      - name: Run EF Core migrations (TST)
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.TST_DB_CONNECTION }}
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update \
            --project src/Infrastructure \
            --startup-project src/API \
            --configuration Release

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Deploy to UAT
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: deploy-tst
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: UAT

    steps:
      - name: Deploy to UAT
        env:
          UAT_SERVICEBUS_CONNECTION: ${{ secrets.UAT_SERVICEBUS_CONNECTION }}
          UAT_JWT_SECRET: ${{ secrets.UAT_JWT_SECRET }}
        run: |
          echo "Deploying to UAT environment..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Deploy to PROD (main only, manual approval via GitHub Environments)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: PROD   # <— requires manual approval in GitHub Environments settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Deploy to PROD
        env:
          PROD_SERVICEBUS_CONNECTION: ${{ secrets.PROD_SERVICEBUS_CONNECTION }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        run: |
          echo "Deploying to PRODUCTION..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Run EF Core migrations (PROD)
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.PROD_DB_CONNECTION }}
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update \
            --project src/Infrastructure \
            --startup-project src/API \
            --configuration Release
